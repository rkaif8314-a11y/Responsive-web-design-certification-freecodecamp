<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>My Todo List</h1>

  <ul class="todo-list">
    <li>
      <input type="checkbox" id="html">
      <label for="html">Learn HTML</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link"
             href="https://developer.mozilla.org/en-US/docs/Web/HTML"
             target="_blank">
            HTML Resources
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="css">
      <label for="css">Learn CSS</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link"
             href="https://developer.mozilla.org/en-US/docs/Web/CSS"
             target="_blank">
            CSS Resources
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="javascript">
      <label for="javascript">Learn JavaScript</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link"
             href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
             target="_blank">
            JavaScript Resources
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="github">
      <label for="github">Practice GitHub</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link"
             href="https://docs.github.com/"
             target="_blank">
            GitHub Resources
          </a>
        </li>
      </ul>
    </li>
  </ul>
</body>
</html>
